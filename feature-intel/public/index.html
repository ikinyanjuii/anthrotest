<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature Intel</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17212b;background:#eef1f4}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:190px minmax(0,1fr) 390px;min-height:100vh}nav,main,aside{padding:22px}nav{background:#e4e9ed;border-right:1px solid #cbd3da;display:flex;flex-direction:column;gap:8px}nav h1{font-size:19px;margin:0 0 20px}nav button,.btn{border:1px solid #263746;background:#263746;color:white;border-radius:5px;padding:9px 12px;cursor:pointer;font-weight:600;text-align:left}nav button{background:transparent;color:#314352;border-color:transparent}nav button.active{background:white;border-color:#d5dce2}main{min-width:0}aside{background:#f8fafb;border-left:1px solid #cbd3da;overflow:auto}.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.bar h2{margin:0 auto 0 0;font-size:22px}.muted,small{color:#637383}.card{background:white;border:1px solid #d6dde3;border-radius:7px;padding:14px;margin:9px 0}.request{display:flex;justify-content:space-between;gap:12px;cursor:pointer}.request:hover{border-color:#0b7773}.request h3{font-size:15px;margin:0 0 6px}.request p{font-size:13px;color:#637383;margin:0 0 8px}.pill{font-size:11px;background:#e0f1ef;color:#0b6e6e;padding:3px 7px;border-radius:12px}.score{font-weight:700;color:#0b6e6e}.btn{display:inline-block;text-align:center;margin:3px 5px 3px 0;font-size:12px}.btn.alt{background:white;color:#263746}.btn.warn{background:#a44b27;border-color:#a44b27}.field{display:block;margin:10px 0;font-size:13px;font-weight:600}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd3da;border-radius:5px;margin-top:5px;font:inherit}textarea{min-height:90px}dialog{border:1px solid #cbd3da;border-radius:9px;width:min(520px,92vw)}dialog::backdrop{background:#14202b88}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.metric{font-size:26px;font-weight:700}.section{margin:22px 0}.section h3{font-size:14px}.score-row{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;margin:8px 0;font-size:12px}.barbg{height:7px;background:#e2e7eb;border-radius:9px}.barbg i{display:block;height:7px;background:#0b7773;border-radius:9px}.notice{padding:10px;background:#e0f1ef;color:#155c57;border-radius:5px;margin:12px 0}.err{background:#fae8e5;color:#8b2f24}.empty{padding:28px;text-align:center;color:#637383}.theme{padding:14px 0;border-bottom:1px solid #e0e5e9}@media(max-width:1000px){.app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border:0}nav h1{width:100%}aside{border:0;border-top:1px solid #cbd3da}}
</style>
</head>
<body>
<div class="app">
<nav><h1>✦ Feature Intel</h1><button class="active" data-view="inbox">Inbox</button><button data-view="themes">Themes & briefs</button><button data-view="criteria">Scoring weights</button><div style="flex:1"></div><label class="field">Voting as<input id="voter" maxlength="100" placeholder="Name or email"></label><button class="btn" id="new">＋ New request</button></nav>
<main><div class="bar"><h2 id="view-title">Feature requests</h2><select id="sort" style="width:auto"><option value="priority">Priority</option><option value="votes">Most votes</option></select></div><div id="notice"></div><div id="main"></div></main>
<aside id="detail"><div class="empty">Select a request to inspect its customer need, AI analysis and decision options.</div></aside>
</div>
<dialog id="request-dialog"><form id="request-form"><h2>Submit a feature request</h2><label class="field">Title<input id="title" required minlength="3" maxlength="200"></label><label class="field">Customer problem<textarea id="description" required minlength="10" maxlength="5000"></textarea></label><label class="field">Source<select id="source"><option value="web">Customer web</option><option value="support">Support</option><option value="sales">Sales</option><option value="internal">Internal</option></select></label><div class="row"><button type="button" class="btn alt" id="cancel">Cancel</button><button class="btn">Submit</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let selected=null, view="inbox";
async function api(path,opts={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||"Request failed");return d}
function notify(msg,error=false){$("#notice").innerHTML='<div class="notice '+(error?'err':'')+'">'+escapeHtml(msg)+'</div>'}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function render(){if(view==="inbox")return inbox();if(view==="themes")return themes();return criteria()}
async function inbox(){ $("#view-title").textContent="Feature requests";const rows=await api("/api/requests?sort="+$("#sort").value);$("#main").innerHTML=rows.length?rows.map(r=>'<article class="card request" data-id="'+r.id+'"><div><h3>'+escapeHtml(r.title)+'</h3><p>'+escapeHtml(r.need||r.description)+'</p><small>'+escapeHtml(r.theme_name||"Awaiting theme")+' · '+r.votes+' votes · '+escapeHtml(r.status)+'</small></div><div><div class="score">'+(r.priority??"—")+'</div><small>priority</small></div></article>').join(""):'<div class="empty">No requests yet. Add one or load the seed data from the API.</div>';$$("[data-id]").forEach(el=>el.onclick=()=>detail(Number(el.dataset.id)))}
async function detail(id){selected=id;const r=await api("/api/requests/"+id);const scores=r.scores||[];const dup=r.duplicate_suggestion;$("#detail").innerHTML='<div class="row"><small>REQUEST #'+r.id+'</small><span class="pill">'+escapeHtml(r.status)+'</span></div><h2>'+escapeHtml(r.title)+'</h2><p class="muted">'+escapeHtml(r.description)+'</p><div class="section"><h3>Underlying customer need</h3><div class="card">'+escapeHtml(r.need||"Not analysed yet")+'</div><small>Theme: '+escapeHtml(r.theme_name||"Unassigned")+' · '+escapeHtml(r.route||"Pending route")+'</small></div><div class="section"><h3>Strategic priority</h3><div class="metric">'+(r.priority??"—")+' / 100</div>'+scores.map(s=>'<div class="score-row"><span>'+escapeHtml(s.criterion)+'</span><div class="barbg"><i style="width:'+(s.score*20)+'%"></i></div><b>'+s.score+'/5</b></div>').join("")+'</div>'+(dup?'<div class="section"><h3>AI duplicate suggestion</h3><p>'+escapeHtml(dup.verdict)+' · '+Math.round((dup.confidence||0)*100)+'% confidence</p><p class="muted">'+escapeHtml(dup.rationale)+'</p><button class="btn" id="merge">Confirm merge</button><button class="btn alt" id="dismiss">Keep separate</button></div>':'')+'<div class="section"><h3>Human decision</h3><button class="btn alt" data-status="planned">Plan</button><button class="btn alt" data-status="shipped">Ship</button><button class="btn alt" data-status="declined">Decline</button><button class="btn alt" id="vote">Support ('+r.votes+')</button><button class="btn alt" id="triage">Re-run AI triage</button><button class="btn alt" id="draft">Draft requester update</button></div><div id="draft-output"></div>';
$("#vote").onclick=async()=>{try{await api('/api/requests/'+id+'/vote',{method:'POST',body:JSON.stringify({voter:$("#voter").value||"anonymous"})});notify("Support recorded");await detail(id);await inbox()}catch(e){notify(e.message,true)}};
$("#triage").onclick=async()=>{try{await api('/api/requests/'+id+'/triage',{method:'POST'});notify("Triage completed");await detail(id);await inbox()}catch(e){notify(e.message,true)}};
$$("[data-status]").forEach(b=>b.onclick=async()=>{try{await api('/api/requests/'+id+'/status',{method:'POST',body:JSON.stringify({status:b.dataset.status})});notify("Status updated");await detail(id);await inbox()}catch(e){notify(e.message,true)}});
if($("#merge"))$("#merge").onclick=async()=>{try{if(!dup?.matches_id)throw Error("No candidate request ID is available.");await api('/api/requests/'+id+'/merge',{method:'POST',body:JSON.stringify({into:dup.matches_id})});notify("Merge confirmed by user");await inbox();await detail(id)}catch(e){notify(e.message,true)}};
if($("#dismiss"))$("#dismiss").onclick=async()=>{try{await api('/api/requests/'+id+'/dismiss-duplicate',{method:'POST'});notify("Duplicate suggestion dismissed");await detail(id)}catch(e){notify(e.message,true)}};
$("#draft").onclick=async()=>{try{const note=prompt("Optional PM note for the draft:")||"";const d=await api('/api/requests/'+id+'/draft-update',{method:'POST',body:JSON.stringify({pm_note:note})});$("#draft-output").innerHTML='<div class="card"><b>'+escapeHtml(d.subject)+'</b><p>'+escapeHtml(d.body)+'</p><small>Draft only — requires human approval before sending.</small></div>'}catch(e){notify(e.message,true)}};
}
async function themes(){ $("#view-title").textContent="Themes & decision briefs";const ts=await api("/api/themes");$("#main").innerHTML=ts.length?ts.map(t=>'<div class="theme"><div class="row"><b>'+escapeHtml(t.name)+'</b><span class="pill">'+t.requests+' requests · '+t.votes+' votes</span></div><p class="muted">'+escapeHtml(t.summary)+'</p><button class="btn" data-brief="'+t.id+'">Generate decision brief</button></div>').join(""):'<div class="empty">Themes appear after requests are analysed.</div>';$$("[data-brief]").forEach(b=>b.onclick=async()=>{try{const d=await api('/api/themes/'+b.dataset.brief+'/brief',{method:'POST'});$("#detail").innerHTML='<div class="section"><h2>Decision brief</h2><pre style="white-space:pre-wrap;font:13px/1.6 inherit">'+escapeHtml(d.markdown)+'</pre></div>'}catch(e){notify(e.message,true)}})}
async function criteria(){ $("#view-title").textContent="Scoring weights";const cs=await api("/api/criteria");$("#main").innerHTML=cs.map(c=>'<div class="card"><div class="row"><b>'+escapeHtml(c.label)+'</b><b>'+Math.round(c.weight*100)+'%</b></div><p class="muted">'+escapeHtml(c.description)+'</p><input type="range" min="0" max="100" value="'+Math.round(c.weight*100)+'" data-weight="'+escapeHtml(c.key)+'"></div>').join("")+'<button class="btn" id="save-weights">Save weights</button><p class="muted">Weights are applied to the deterministic score. Set all weights to zero to disable scoring.</p>';$("#save-weights").onclick=async()=>{try{for(const el of $$("[data-weight]"))await api('/api/criteria/'+el.dataset.weight,{method:'PUT',body:JSON.stringify({weight:Number(el.value)/100})});notify("Scoring weights saved")}catch(e){notify(e.message,true)}}}
$$("nav button[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;$$("nav button").forEach(x=>x.classList.toggle("active",x===b));render().catch(e=>notify(e.message,true))});
$("#sort").onchange=()=>render().catch(e=>notify(e.message,true));
$("#new").onclick=()=>$("#request-dialog").showModal();$("#cancel").onclick=()=>$("#request-dialog").close();
$("#request-form").onsubmit=async e=>{e.preventDefault();try{await api("/api/requests",{method:"POST",body:JSON.stringify({title:$("#title").value,description:$("#description").value,source:$("#source").value,requester:$("#voter").value||"anonymous"})});$("#request-dialog").close();e.target.reset();notify("Request submitted. AI triage is running in the background.");await inbox()}catch(err){notify(err.message,true)}};
render().catch(e=>notify(e.message,true));
</script>
</body></html>
